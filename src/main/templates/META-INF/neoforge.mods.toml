modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="MrWizard94"
description='''
Replaces lanterns in newly generated chunks with Torchmaster Feral Flare Lanterns while never converting normal player placements. Includes an opt-in, one-time migration prompt for pre-existing chunks.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.41,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="torchmaster"
type="required"
versionRange="[21.1.0,)"
ordering="AFTER"
side="BOTH"
